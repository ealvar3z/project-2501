<!doctype html>
<title>base64 test</title>
<div id=x>Fail</div>
<script src=asserts.js></script>
<script>

const div = document.getElementById("x");
assertEquals(atob(""), "");
assertEquals(atob(" "), "");
assertEquals(atob("YQ"), "a");
assertEquals(atob("YR"), "a");
assertThrows(() => atob("!"), DOMException);
assertThrows(() => atob("a"), DOMException);
assertThrows(() => atob("aaaaa"), DOMException);
assertThrows(() => atob("Aaa=="), DOMException);
assertThrows(() => atob("Aaaa=="), DOMException);
assertThrows(() => atob("Aaaaa=="), DOMException);
assertThrows(() => atob("Aa aaa= = "), DOMException);
assertEquals(atob("AAAAAA=="), atob("AAAAAA"));
assertEquals(atob("AAAAAA"), atob("A A A A A A"));
assertEquals(atob("AAAAAA"), "\u0000\u0000\u0000\u0000");
assertEquals(atob("ABCDEF"), "\u0000\u0010\u0083\u0010");
assertEquals(atob("//////"), "ÿÿÿÿ");
const longa =
	"R28gdGVzdCBkYXRhIHNob3VsZCBzdGF5IHBsYWluLCBmb2N1c2VkLCBhbmQgZWFzeSB0byB1cGRhdGUuCg==";
const longb = "Go test data should stay plain, focused, and easy to update.\n";
assertEquals(atob(longa), longb);
assertEquals(btoa(""), "");
assertEquals(btoa("a"), "YQ==");
assertEquals(btoa("aa"), "YWE=");
assertEquals(btoa("aaa"), "YWFh");
assertEquals(btoa("aaazdxfksljdf"), "YWFhemR4ZmtzbGpkZg==");
assertEquals(btoa(longb), longa);
assertThrows(() => btoa("őÉéeé"), DOMException);
div.textContent = "Success";
</script>
